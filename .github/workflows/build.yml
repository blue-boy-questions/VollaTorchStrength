name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_VERSION: "8.7"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare SDK (use preinstalled) + NDK
        run: |
          set -e
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMGR=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;26.1.10909125" >/dev/null
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Build root daemon (aarch64)
        run: |
          set -e
          CC="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          "$CC" -O2 -Wall -o vollatorchd daemon/vollatorchd.c
          file vollatorchd
          cp vollatorchd ksu-module/vollatorchd

      - name: Fetch Gradle ${{ env.GRADLE_VERSION }} (AGP-compatible)
        run: |
          set -e
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q "gradle-${GRADLE_VERSION}-bin.zip"
          echo "GRADLE_BIN=$PWD/gradle-${GRADLE_VERSION}/bin/gradle" >> $GITHUB_ENV

      - name: Generate wrapper + build APK
        run: |
          set -e
          "$GRADLE_BIN" wrapper --gradle-version "$GRADLE_VERSION"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p out
          find app/build/outputs -name '*.apk' -exec cp {} out/VollaTorchStrength.apk \;
          cd ksu-module && zip -r9 ../out/VollaTorchStrength-daemon.zip . -x '*.DS_Store' && cd ..
          ls -la out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VollaTorchStrength
          path: out/*
